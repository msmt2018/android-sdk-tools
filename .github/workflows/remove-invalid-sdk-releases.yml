name: Remove inconsistent SDK releases

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/remove-invalid-sdk-releases.yml"

permissions:
  contents: write

jobs:
  remove-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases with mismatched package metadata or source base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          releases=(
            "448801851:platform-tools-37.0.1"
            "448817699:platform-tools-35.0.2"
          )
          for item in "${releases[@]}"; do
            release_id="${item%%:*}"
            tag="${item#*:}"
            status="$(curl -sS -o /tmp/release.json -w '%{http_code}' \
              -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPOSITORY}/releases/${release_id}")"
            if [[ "${status}" != "204" && "${status}" != "404" ]]; then
              cat /tmp/release.json
              echo "Release deletion failed for ${tag}: HTTP ${status}" >&2
              exit 1
            fi
            status="$(curl -sS -o /tmp/ref.json -w '%{http_code}' \
              -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPOSITORY}/git/refs/tags/${tag}")"
            if [[ "${status}" != "204" && "${status}" != "404" && "${status}" != "422" ]]; then
              cat /tmp/ref.json
              echo "Tag deletion failed for ${tag}: HTTP ${status}" >&2
              exit 1
            fi
            echo "Removed ${tag}"
          done
