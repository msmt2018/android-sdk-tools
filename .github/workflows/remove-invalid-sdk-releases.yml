name: Remove outdated 35.0.0 release

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/remove-invalid-sdk-releases.yml"

permissions:
  contents: write

jobs:
  remove-release:
    runs-on: ubuntu-latest
    steps:
      - name: Delete 35.0.0 release built from newer source tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/release.json -w '%{http_code}' \
            -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/releases/448824508")"
          if [[ "${status}" != "204" && "${status}" != "404" ]]; then
            cat /tmp/release.json
            echo "Release deletion failed: HTTP ${status}" >&2
            exit 1
          fi
          status="$(curl -sS -o /tmp/ref.json -w '%{http_code}' \
            -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/git/refs/tags/platform-tools-35.0.0")"
          if [[ "${status}" != "204" && "${status}" != "404" && "${status}" != "422" ]]; then
            cat /tmp/ref.json
            echo "Tag deletion failed: HTTP ${status}" >&2
            exit 1
          fi
          echo "platform-tools-35.0.0 release removed."
