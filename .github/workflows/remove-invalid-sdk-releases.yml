name: Remove invalid SDK releases

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/remove-invalid-sdk-releases.yml"

permissions:
  contents: write

jobs:
  remove-invalid-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Delete affected published releases and release tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          releases=(
            "448804855:platform-tools-37.0.0"
            "448803425:platform-tools-37.0.2"
            "448798620:platform-tools-36.0.0"
            "448802072:platform-tools-36.0.1"
            "449216991:platform-tools-36.0.2"
          )
          for item in "${releases[@]}"; do
            release_id="${item%%:*}"
            tag="${item#*:}"
            echo "Deleting release ${tag} (${release_id})"
            status="$(curl -sS -o /tmp/release.json -w '%{http_code}' \
              -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPOSITORY}/releases/${release_id}")"
            if [[ "${status}" != "204" && "${status}" != "404" ]]; then
              cat /tmp/release.json
              echo "Release deletion failed: HTTP ${status}" >&2
              exit 1
            fi
            status="$(curl -sS -o /tmp/ref.json -w '%{http_code}' \
              -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPOSITORY}/git/refs/tags/${tag}")"
            if [[ "${status}" != "204" && "${status}" != "404" ]]; then
              cat /tmp/ref.json
              echo "Tag deletion failed: HTTP ${status}" >&2
              exit 1
            fi
          done
          echo "All targeted releases and tags are absent."
